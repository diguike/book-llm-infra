# LLaMA-Factory QLoRA 微调配置
#
# 使用方法:
#   1. 安装 LLaMA-Factory: pip install llamafactory
#   2. 运行训练: llamafactory-cli train 04_llamafactory_config.yaml
#   3. 合并权重: llamafactory-cli export 04_llamafactory_config.yaml
#
# 这个配置在单卡 A10 (24GB) 上可以直接运行。

# ============================================================
# 模型配置
# ============================================================
model_name_or_path: Qwen/Qwen2-7B
template: qwen            # 对话模板，LLaMA-Factory 会自动处理 chat format
trust_remote_code: true

# ============================================================
# 训练方法
# ============================================================
stage: sft                 # 监督微调（也支持 dpo, ppo, orpo, kto 等）
do_train: true
finetuning_type: lora      # lora / full / freeze

# LoRA 配置
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all           # 对所有线性层加 LoRA

# 量化配置（QLoRA）
quantization_bit: 4        # 4-bit 量化；设为 null 或删除此行则用 bf16 LoRA
quantization_method: bitsandbytes

# ============================================================
# 数据配置
# ============================================================
# LLaMA-Factory 的数据需要在 data/dataset_info.json 中注册
# 或者直接使用内置数据集名称
dataset: alpaca_en          # 内置数据集，可替换为自定义数据
cutoff_len: 1024            # 最大序列长度
overwrite_cache: true
preprocessing_num_workers: 8

# 自定义数据集示例（取消注释并修改路径）:
# dataset: my_custom_data
# dataset_dir: ./data        # 数据目录
# 需要在 data/dataset_info.json 中添加:
# {
#   "my_custom_data": {
#     "file_name": "sample_train.jsonl",
#     "formatting": "sharegpt",
#     "columns": {
#       "messages": "messages"
#     }
#   }
# }

# ============================================================
# 训练参数
# ============================================================
output_dir: ./output/qwen2-7b-llamafactory
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0

# 精度和优化
bf16: true
flash_attn: fa2             # FlashAttention-2，需要 Ampere+ GPU
gradient_checkpointing: true
optim: paged_adamw_8bit     # QLoRA 推荐的优化器

# 日志和保存
logging_steps: 10
save_steps: 500
save_total_limit: 2

# ============================================================
# 其他选项
# ============================================================
# neftune_noise_alpha: 5    # NEFTune：在 embedding 上加噪声，可能提升效果
# use_dora: true            # 使用 DoRA（Weight-Decomposed LoRA）
# val_size: 0.05            # 从训练集中划分 5% 作为验证集
# eval_strategy: steps
# eval_steps: 100

# ============================================================
# 导出配置（合并权重时使用）
# ============================================================
# 运行 llamafactory-cli export 时使用以下配置:
# export_dir: ./output/qwen2-7b-merged
# export_size: 4             # 分片大小（GB）
# export_legacy_format: false
