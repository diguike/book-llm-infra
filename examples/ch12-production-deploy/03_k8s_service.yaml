# K8s Service + Ingress for vLLM
# 暴露 vLLM 推理服务，配合 Nginx Ingress Controller 使用
#
# 部署: kubectl apply -f 03_k8s_service.yaml

---
# ClusterIP Service：集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-7b
  namespace: llm-serving
  labels:
    app: vllm-qwen-7b
spec:
  type: ClusterIP
  selector:
    app: vllm-qwen-7b
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
# Ingress：外部访问（通过 Nginx Ingress Controller）
# 前提：已安装 Nginx Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ingress
  namespace: llm-serving
  annotations:
    # Nginx Ingress 特有配置
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"      # streaming 需要长超时
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"          # 关闭缓冲，SSE 必须
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # 限流（备用，主要限流逻辑在 API Gateway 里）
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - llm-api.example.com
    secretName: llm-api-tls
  rules:
  - host: llm-api.example.com
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: vllm-qwen-7b
            port:
              number: 8000

---
# 如果不用 Ingress，可以用 NodePort 快速暴露（仅限测试）
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-7b-nodeport
  namespace: llm-serving
  labels:
    app: vllm-qwen-7b
spec:
  type: NodePort
  selector:
    app: vllm-qwen-7b
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
